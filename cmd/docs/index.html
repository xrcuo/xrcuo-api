<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Xrcuo API 文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Xrcuo API 文档">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="vue.css">
  <style>
    .docsify-copy-code-button {
      background-color: #42b983;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .docsify-copy-code-button:hover {
      opacity: 1;
    }

    .docsify-copy-code-button.success {
      background-color: #2ecc71;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <!-- Docsify v4 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 复制代码插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script>
    // 获取当前访问的域名（包括协议和端口）
    var currentDomain = window.location.protocol + '//' + window.location.host;
    
    window.$docsify = {
      name: 'Xrcuo API',
      repo: 'https://github.com/xrcuo/xrcuo-api',
      loadSidebar: true,
      loadSidebarLevel: 1,
      alias: {
        './_sidebar.md ': './_sidebar.md'
      },
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      },
      // 钩子函数，在渲染完成后替换 YOUR_DOMAIN
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            // 替换页面中所有的 YOUR_DOMAIN 为当前域名
            var content = document.querySelector('#main');
            if (content) {
              var html = content.innerHTML;
              html = html.replace(/YOUR_DOMAIN/g, currentDomain);
              content.innerHTML = html;
            }
          });
        }
      ]
    }
  </script>
</body>

</html>
