<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/index.css">
</head>

<body>

    <div class="center">
        <!-- ************************************** -->
        <!-- pc端顶部导航栏 -->
        <div class="header">
            <div class="header_box">
                <div class="bar">
                    <span class="bar_btn">
                        <a class="nav-item active" data-page="home" href="#">
                            <i class="menu-icon">🏠</i>
                            <span>首页</span>
                        </a>
                        <a class="nav-item" data-page="blog" href="{{.Links.Blog}}" target="_blank">
                            <i class="menu-icon">📝</i>
                            <span>博客</span>
                        </a>
                        <a class="nav-item" data-page="cdk" href="{{.Links.CDK}}" target="_blank">
                            <i class="menu-icon">🌟</i>
                            <span>CDK兑换</span>
                        </a>
                        <a class="nav-item" data-page="api" href="{{.Links.API}}" target="_blank">
                            <i class="menu-icon">🔒</i>
                            <span>API/统计</span>
                        </a>
                        <a class="nav-item" data-page="about" href="{{.Links.About}}" target="_blank">
                            <i class="menu-icon">💫</i>
                            <span>关于</span>
                        </a>
                    </span>
                </div>
            </div>

        </div>
        <!-- 移动端侧边栏 -->
        <div class="sidebar" id="sidebar">
            <!-- 添加头像和个人信息区域 -->
            <div class="sidebar-profile">
                <img src="{{.AvatarURL}}" alt="头像" class="sidebar-avatar">
                <div class="sidebar-info">
                    <h3>{{.Name}}</h3>
                    <p>欢迎光临我的小站~</p>
                </div>
            </div>
            <!-- 菜单项添加图标 -->
            <a class="menu-item active" data-page="home" href="#">
                <i class="menu-icon">🏠</i>
                <span>首页</span>
            </a>
            <a class="menu-item" data-page="blog" href="{{.Links.Blog}}" target="_blank">
                <i class="menu-icon">📝</i>
                <span>博客</span>
            </a>
            <a class="menu-item" data-page="cdk" href="{{.Links.CDK}}" target="_blank">
                <i class="menu-icon">🌟</i>
                <span>CDK兑换</span>
            </a>
            <a class="menu-item" data-page="api" href="{{.Links.API}}" target="_blank">
                <i class="menu-icon">🔒</i>
                <span>API/统计</span>
            </a>
            <a class="menu-item" data-page="about" href="{{.Links.About}}" target="_blank">
                <i class="menu-icon">💫</i>
                <span>关于</span>
            </a>
            <!-- 添加二次元装饰元素 -->
            <div class="sidebar-decoration">
                <p class="kawaii-text">ヾ(≧▽≦*)o</p>
            </div>
        </div>
        <!-- 侧边栏展开按钮 -->
        <div class="sidebar_toggle" onclick="toggleSidebar()">☰</div>
        <!-- ************************************** -->


        <!-- 中间内容 -->
        <div class="main_center">
            <div class="main_cn">
                <img src="{{.AvatarURL}}" alt="用户头像" class="avatar">
                <h1 class="site-title">{{.Name}}</h1>
                <p class="motto">{{.Motto}}</p>
                <p class="line"></p>
                <p class="dynamics_text"><!-- 你在黄昏寄一场梦给我 满载相思的欢喜和宇宙的星辰♡ --></p>
                <span class="contact_me">
                    <a class="image_box" href="{{.Contact.GitHub}}" target="_blank">
                        <img src="/static/image/lianxiwo/github-fill.png" alt="github">
                    </a>
                    <a class="image_box" href="{{.Contact.Zhihu}}" target="_blank">
                        <img src="/static/image/lianxiwo/zhihu.png" alt="知乎">
                    </a>
                    <a class="image_box" href="{{.Contact.Weibo}}" target="_blank">
                        <img src="/static/image/lianxiwo/weibo-copy.png" alt="微博">
                    </a>
                    <a class="image_box" href="{{.Contact.Email}}" target="_blank">
                        <img src="/static/image/lianxiwo/youxiang.png" alt="邮箱">
                    </a>
                </span>
            </div>
        </div>
    </div>
    <!-- 页脚 -->
    <div class="footer">
        <div class="box">
            <a href="https://beian.miit.gov.cn/">{{.ICP}}</a>
            <p class="text">{{.Copyright}}</p>
        </div>
    </div>
</body>
<script src="/static/js/index.js"></script>

</html>
